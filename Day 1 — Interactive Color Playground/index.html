<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 — Interactive Color Playground</title>
    <link rel="stylesheet" href="style.css">
    <style>
        main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card-container{
            text-align: center;
            /* border: 2px solid black; */
            background-color: #ffffff31;
            padding: 0 30px 30px 30px;
            border-radius: 20px;
            box-shadow: inset 0 0 15px 10px rgba(0, 0, 0, 0.195);
        }

        .color-label{
            cursor: pointer;
            font-size: 2rem;
            display: block;
            text-shadow: 0 0 10px white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .color-label:hover{
            text-decoration: underline;
        }

        .input-group{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        input{
            cursor: pointer;
        } 

        input[type='color']{
            width: 40px;
            height: 40px;
            background-color: transparent; /* Removes default grey background */
            border: none;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 50%; /* Makes the inner swatch a circle */
        }

        input[type='button']{
            border: 1px solid black;
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: bold;
            background-color: #ffffff50;
            box-shadow: 0 0 10px 1px rgba(255, 255, 255, 0.300);
        }

        input[type='button']:active{
            box-shadow: inset 0 0 10px 1px rgba(0, 0, 0, 0.6);
        }

    </style>
</head>
<body>
    <main>
        <div class="card-container">
            <p for="color-name" class="color-label" id="colorLabel">Color Name</p>
            
            <div class="input-group">
                <input type="color" id="colorInput">
                <input type="button" value="Reset" id="resetBtn">
                <input type="button" value="Random Color" id="randomBtn">
            </div>
        </div>
    </main>

    <script>
        const colorLabel = document.getElementById('colorLabel');
        const colorInput = document.getElementById('colorInput');
        const resetBtn = document.getElementById('resetBtn');
        const randomBtn = document.getElementById('randomBtn');

        let currentColor = '';

        // Function For Random Color
        function getRandomColor() {
            const randomColor = Math.floor(Math.random() * 16777216); // 255^3 = 16777216 all rgb combination
            const hexValue = randomColor.toString(16);
            return `#${hexValue.padStart(6, '0')}`;
        };

        // Copy Color Name
        colorLabel.addEventListener('click',() => {
            navigator.clipboard.writeText(currentColor)
                .then(() => {
                    // Success
                    alert('Color Copied: ' + currentColor);
                })
                .catch(err => {
                    // Failed (biasanya karena masalah izin browser)
                    alert('Failed to copy');
                    console.error('Failed to copy: ', err);
                });
        });


        //  Random Button
        randomBtn.addEventListener('click', () => {
            const randomColor = getRandomColor();
            colorLabel.textContent = randomColor;
            document.body.style.backgroundColor = randomColor;
            colorInput.value = randomColor;
            currentColor = randomColor
        });

        //  Color Input
        colorInput.addEventListener('input', (event) => {
            const selectedColor = event.target.value; // return value hex
            colorLabel.textContent = selectedColor;
            currentColor = selectedColor;
            document.body.style.backgroundColor = selectedColor;
        });

        //  Reset Button
        resetBtn.addEventListener('click', () => {
            colorInput.value = colorInput.defaultValue;
            document.body.style.backgroundColor = '#fff';
            colorLabel.textContent = 'Color Name';
            currentColor = '#fff';
        });

    </script>
</body>
</html>
