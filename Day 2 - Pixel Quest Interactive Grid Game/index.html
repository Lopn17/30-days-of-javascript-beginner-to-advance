<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Pixel Quest Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --card-bg: #061320;
            --color-bg: #0b203b;
            --color-bg2: #05101e;
            --title-col: #aeecff;
            --title-col2: #ecc14a;
            --box-color: #273653;
            --text-color: #a2b1e1;
        }

        body{
            background-color: var(--color-bg2);
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        
        main{
            background-color: var(--color-bg);
            height: auto;
            width: auto;
            border-radius: 10px;
            padding: 14px;
        }

        .container{
            background-color: var(--color-bg2);
            padding: 1px 10px 10px 10px;
            border-radius: 10px;
        }
        
        h1{
            font-family: "Pixelify Sans", sans-serif;
            color: var(--title-col2);
            text-align: center;
            margin: 10px 0 10px 0;
        }

        h1 span{
            color: var(--title-col);
            
        }

        .stats-container{
            border: 2px solid white;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .stats{
            color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stats span{
            display: block;
        }
        .stats img{
            border: 1px solid white;
            height: 30px;
        }

        .boxes-container{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .box{
            width: 50px;
            height: 50px;
            background: var(--box-color);
        }

    </style>

</head>
<body>
    <main>
        <div class="container">
            <h1><span>Pixel</span> Quest</h1>
            <div class="stats-container">
                <div class="stats">
                    <img src="guide.png" alt="">
                    <div class="stats-info">
                        <span class="score-label">Score</span>
                        <span class="score">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img src="guide.png" alt="">
                    <div class="stats-info">
                        <span class="highscore-label">High Score</span>
                        <span class="high-score">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img src="guide.png" alt="">
                    <div class="stats-info">
                        <span class="attempts-label">Attempts</span>
                        <span class="attempts">0</span>
                    </div>
                </div>
            </div>
            <div class="boxes-container">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </div>
    </main>
    
</body>
</html>
