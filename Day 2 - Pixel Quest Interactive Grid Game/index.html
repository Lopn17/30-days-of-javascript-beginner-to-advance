<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Pixel Quest Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --card-bg: #061320;
            --color-bg: #0b203b;
            --color-bg2: #05101e;
            --title-col: #aeecff;
            --title-col2: #ecc14a;
            --box-color: #273653;
            --text-color: #a2b1e1;
            --stats-bg: #0c305c;
        }

        body{
            background-color: var(--color-bg2);
            display: flex;
            min-height: 100vh;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        
        main{
            background-color: var(--color-bg);
            height: auto;
            width: auto;
            border-radius: 10px;
            padding: 14px;
        }

        .container{
            background-color: var(--color-bg2);
            padding: 1px 10px 10px 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1{
            font-family: "Pixelify Sans", sans-serif;
            color: var(--title-col2);
            text-align: center;
            margin: 10px 0 10px 0;
        }

        h1 span{
            color: var(--title-col);
            
        }

        .stats-container{
            border: 3px solid rgb(4, 218, 247);
            padding: 8px;
            display: flex;
            justify-content: space-between;
            border-radius: 10px;
            align-items: center;
            width: 100%;
            background-color: var(--stats-bg);
        }

        .stats{
            color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stats span{
            display: block;
        }
        .stats img{
            height: 40px;
        }

        .img-star{
            transform: scale(1.3);
        }

        .img-high{
            transform: scale(1.4);
        }

        .boxes-container{
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .box{
            width: 60px;
            height: 60px;
            background: var(--box-color);
            font-size: 1.4rem;
            color: white;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            align-items: center;
            justify-content: center;
            border: 2px solid cyan;
        }

    </style>

</head>
<body>
    <main>
        <div class="container">
            <h1><span>Pixel</span> Quest</h1>
            <div class="stats-container">
                <div class="stats">
                    <img class="img-star" src="assets/star.png" alt="">
                    <div class="stats-info">
                        <span class="score-label">Score</span>
                        <span class="score">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img class="img-high" src="assets/highscore.png" alt="">
                    <div class="stats-info">
                        <span class="highscore-label">High Score</span>
                        <span class="high-score">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img src="assets/attempts.png" alt="">
                    <div class="stats-info">
                        <span class="attempts-label">Attempts</span>
                        <span class="attempts">0</span>
                    </div>
                </div>
            </div>
            <div class="boxes-container">
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
                <div class="box">?</div>
            </div>
        </div>
    </main>
    
</body>
</html>
