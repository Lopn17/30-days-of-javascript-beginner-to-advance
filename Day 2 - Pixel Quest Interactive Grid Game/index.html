<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Pixel Quest Interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root{
            --card-bg: #0a1f33;
            --color-bg: #0b203b;
            --color-bg2: #05101e;
            --title-col: #aeecff;
            --title-col2: #ecc14a;
            --box-color: #273653;
            --text-color: #a2b1e1;
            --stats-bg: #0c305c;
        }

        body{
            background-color: var(--color-bg2);
            display: flex;
            min-height: 100vh;
            padding: 20px;
            justify-content: center;
            align-items: center;
        }
        
        main{
            background-color: var(--color-bg);
            height: auto;
            width: auto;
            border-radius: 10px;
            padding: 14px;
        }

        .container{
            background-color: var(--color-bg2);
            padding: 1px 10px 10px 10px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        h1{
            font-family: "Pixelify Sans", sans-serif;
            color: var(--title-col);
            text-align: center;
            margin: 10px 0 10px 0;
            user-select: none;
        }

        h1 span{
            color: var(--title-col2);
            
        }

        .stats-container{
            border: 3px solid rgb(4, 218, 247);
            padding: 8px;
            display: flex;
            justify-content: space-between;
            border-radius: 10px;
            align-items: center;
            font-family: 'Geist Pixel', sans-serif;
            gap: 20px;
            width: 100%;
            background-color: var(--stats-bg);
        }

        .stats{
            color: whitesmoke;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .stats span{
            display: block;
        }
        .stats img{
            height: 40px;
        }

        .img-star{
            transform: scale(1.3);
        }

        .img-high{
            transform: scale(1.5);
        }

        .boxes-container{
            margin-top: 10px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .box{
            width: 67px;
            height: 67px;
            background: var(--box-color);
            font-size: 1.4rem;
            color: white;
            display: flex;
            position: relative;
            font-family: 'Pixelify Sans', sans-serif;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(0, 255, 255, 0.636);
            user-select: none;
        }

        .box:not(.selected, .target-core):hover{
            border: 2px solid cyan;
            background: #384d76;
            box-shadow: inset 0 0 5px 5px rgba(0, 255, 255, 0.177);
            box-shadow: 0 0 5px 5px rgba(0, 255, 255, 0.177);
        }

        .selected {
            border: 2px solid rgba(255, 0, 0, 0.637);
            user-select: none;
            color: red;
            background: rgb(89, 15, 15);
        }

        .target-core{
            border: 2px solid rgba(242, 255, 0, 0.637);
            user-select: none;
            color: rgb(238, 255, 0);
            background: rgb(89, 83, 15);
        }
        .target-core-answer{
            color: white;
            left: 10px;
            top: 10px;
            font-family: Arial, Helvetica, sans-serif;
            position: absolute;
        }
        .target-core-answer span{
            font-weight: bolder;
            color: yellow;
        }

        .hidden{
            display: none;
        }

        .idBox{
            position: absolute;
            top: 3px;
            left: 3px;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            font-size: small;
        }
        .core{
            color: yellow;
        }
        /* .done{
            display: none;
        } */
    </style>

</head>
<body>
    <div class="target-core-answer hidden" id="targetCoreAns">
        target box core: <span id="answer">none</span>
    </div>
    <main>
        <div class="container">
            <h1>Pixel <span id="devMode">Quest</span></h1>
            <div class="stats-container">
                <div class="stats">
                    <img class="img-star" src="assets/star.png" alt="">
                    <div class="stats-info">
                        <span class="score-label">Score</span>
                        <span class="score" id="scoreStats">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img class="img-high" src="assets/highscore.png" alt="">
                    <div class="stats-info">
                        <span class="highscore-label">High Score</span>
                        <span class="high-score">0</span>
                    </div>
                </div>
                <div class="stats">
                    <img src="assets/attempts.png" alt="">
                    <div class="stats-info">
                        <span class="attempts-label">Attempts</span>
                        <span class="attempts">0</span>
                    </div>
                </div>
            </div>
            <div class="boxes-container"></div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
